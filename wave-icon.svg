<svg width="128" height="128" viewBox="0 0 52 20" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- 움직이는 색 패턴 -->
    <linearGradient id="multiWaveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      
      <stop offset="0%" stop-color="#FF0000">
        <animate attributeName="stop-color"
          values="#FF0000;#FF6A00;#FFD400;#2FFF00;#002BFF;#7C3AED;#FF4FA3;#FF0000"
          dur="4s" repeatCount="indefinite"/>
      </stop>

      <stop offset="25%" stop-color="#FF6A00">
        <animate attributeName="stop-color"
          values="#FF6A00;#FFD400;#2FFF00;#002BFF;#7C3AED;#FF4FA3;#FF0000;#FF6A00"
          dur="4s" repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#2FFF00">
        <animate attributeName="stop-color"
          values="#2FFF00;#002BFF;#7C3AED;#FF4FA3;#FF0000;#FF6A00;#FFD400;#2FFF00"
          dur="4s" repeatCount="indefinite"/>
      </stop>

      <stop offset="75%" stop-color="#002BFF">
        <animate attributeName="stop-color"
          values="#002BFF;#7C3AED;#FF4FA3;#FF0000;#FF6A00;#FFD400;#2FFF00;#002BFF"
          dur="4s" repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color"
          values="#7C3AED;#FF4FA3;#FF0000;#FF6A00;#FFD400;#2FFF00;#002BFF;#7C3AED"
          dur="4s" repeatCount="indefinite"/>
      </stop>

    </linearGradient>
  </defs>

  <!-- 위로 솟은 wave -->
  <path d="
    M0 12
    C 3 5, 6 5, 9 12
    S 15 19, 18 12
    S 24 5, 27 12
    S 33 19, 36 12
    S 42 5, 45 12
    S 49 19, 52 12
  "
  fill="none"
  stroke="url(#multiWaveGradient)"
  stroke-width="2"
  stroke-linecap="round"/>

</svg>